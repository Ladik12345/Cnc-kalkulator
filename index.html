<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dílenská příručka – Probíhá kontrola</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-warning: #f59e0b;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 40px 32px;
      max-width: 560px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }

    .icon-wrapper {
      width: 64px;
      height: 64px;
      background-color: rgba(245, 158, 11, 0.1);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .icon-wrapper svg {
      width: 32px;
      height: 32px;
      stroke: var(--accent-warning);
    }

    .status-badge {
      display: inline-block;
      background-color: rgba(245, 158, 11, 0.15);
      color: var(--accent-warning);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 16px;
      letter-spacing: -0.025em;
    }

    p {
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .footer-info {
      border-top: 1px solid var(--border-color);
      padding-top: 20px;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .footer-info span {
      color: var(--text-main);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="icon-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
      </svg>
    </div>

    <div class="status-badge">Probíhá audit dat</div>

    <h1>Dílenská příručka je dočasně nedostupná</h1>

    <p>
      Omlouváme se, ale dílenská příručka je aktuálně ve fázi hloubkové kontroly. 
      Byly v ní zjištěny kritické nepřesnosti, které si s ohledem na náš závazek 
      k maximální preciznosti vůči zákazníkům nemůžeme dovolit.
    </p>

    <div class="footer-info">
    </div>
  </div>

</body>
</html>
